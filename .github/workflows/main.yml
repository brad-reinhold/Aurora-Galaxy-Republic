name: Analyze & Index All Content for SEO Discovery

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 2,8,14,20 * * *'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      jobs:
  analyze:
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set environment variables
        run: |
          export INSTAGRAM_USERNAME=${{ secrets.INSTAGRAM_USERNAME }}
          export INSTAGRAM_PASSWORD=${{ secrets.INSTAGRAM_PASSWORD }}

      - name: Run Full Content Analysis
        continue-on-error: true
        timeout-minutes: 30
        run: python analyze.py $FILMFREEWAY_USERNAME $FILMFREEWAY_PASSWORD

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-results
          path: |
            analysis.md
            crawl_cache.json
            failed_domains.json
          retention-days: 90

      - name: Commit Results
        env:
          GITHUB_TOKEN: ${{ secrets.copilot_app_key_github_private_key }}
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Workflow"
          git add analysis.md failed_domains.json crawl_cache.json || true
          git commit -m "chore: update content analysis index [skip ci]" || true
          git push || true
        continue-on-error: true
